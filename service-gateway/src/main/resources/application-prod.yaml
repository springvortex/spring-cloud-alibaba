spring:
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
    gateway:
      server:
        webflux:
          routes:
            - id: provider-route
              uri: lb://service-provider
              predicates:
                - Path=/api/*/provider/**
              order: 1

            - id: consumer-route
              uri: lb://service-consumer
              predicates:
                - Path=/api/*/consumer/**
              order: 2

            - id: mail-route
              uri: lb://service-mail
              predicates:
                - Path=/api/*/mail/**
              order: 3

management:
  tracing:
    sampling:
      probability: 0.1
    export:
      zipkin:
        endpoint: http://127.0.0.1:9411/api/v2/spans

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
