server:
  port: 80

zjc:
  infrastructure:
    host: ${INFRASTRUCTURE_HOST:129.204.226.206}

spring:
  application:
    name: service-gateway
  profiles:
    active: dev
    include:
      - zipkin
      - sentinel
  cloud:
