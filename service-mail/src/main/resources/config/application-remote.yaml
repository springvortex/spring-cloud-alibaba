spring:
  cloud:
    nacos:
      config:
        server-addr: ${zjc.infrastructure.host}:8848
        file-extension: yaml
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
  config:
    import:
      - nacos:${zjc.config.env}?group=${spring.application.name}&namespace=public&refreshEnabled=true
      - nacos:jasypt?group=spring-cloud-alibaba-public&namespace=public&refreshEnabled=true
      - nacos:api?group=spring-cloud-alibaba-public&namespace=public&refreshEnabled=true
      - nacos:zipkin?group=spring-cloud-alibaba-public&namespace=public&refreshEnabled=true
