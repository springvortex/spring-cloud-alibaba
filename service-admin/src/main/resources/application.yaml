server:
  port: 9003

spring:
  application:
    name: service-admin
  profiles:
    active: dev
    include:
      - nacos
  boot:
    admin:
      ui:
        title: Spring Cloud Alibaba Admin
  security:
    user:
      # 登录用户名（默认 admin，可通过环境变量 SBA_USERNAME 覆盖）
      name: ${SBA_USERNAME:admin}
      # 登录密码（必须设置，通过环境变量 SBA_PASSWORD 或 VM 参数 -DSBA_PASSWORD=xxx 传入，禁止写死）
      password: ${SBA_PASSWORD}

# Actuator 端点暴露（供 SBA 采集监控数据）
management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always
