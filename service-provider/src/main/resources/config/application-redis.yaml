spring:
  cache:
    type: redis

zjc:
  cache:
    redis:
      enabled: true
      key-prefix: "zjc:"
      default-ttl: 30m
      cache-ttls:
        provider:user:id: 30m
        provider:goods:id: 30m
      allowed-sub-types:
        - java.math.BigDecimal
  redisson:
    enabled: true
    lock-watchdog-timeout: 30s
