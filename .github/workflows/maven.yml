name: Java CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build and package
        run: mvn -B -ntp package -DskipTests --file pom.xml

      - name: Collect executable JARs
        shell: bash
        run: |
          set -euo pipefail

          rm -rf packaging
          found=0
          shopt -s nullglob

          for jar in */target/*.jar; do
            module="${jar%%/*}"
            if unzip -p "$jar" META-INF/MANIFEST.MF | grep -q '^Main-Class:'; then
              mkdir -p "packaging/$module"
              cp "$jar" "packaging/$module/"
              found=$((found + 1))
            fi
          done

          if [ "$found" -eq 0 ]; then
            echo "No executable JARs were found." >&2
            exit 1
          fi

          echo "Collected $found executable JAR(s):"
          find packaging -type f -name '*.jar' -print

      - name: Upload application JARs
        uses: actions/upload-artifact@v7
        with:
          name: application-jars
          path: packaging/*/*.jar
          if-no-files-found: error
          retention-days: 7

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*.xml'
          if-no-files-found: ignore
          retention-days: 7

  dependency-graph:
    name: Submit Maven dependency graph
    runs-on: ubuntu-latest
    needs: build
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    permissions:
      contents: write

    steps:

      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Submit dependency graph
        # v5.0.0 supports Maven multi-module projects.
        uses: advanced-security/maven-dependency-submission-action@b275d12641ac2d2108b2cbb7598b154ad2f2cee8
