spring:
  cloud:
    nacos:
      discovery:
        server-addr: 129.204.226.206:8848
    openfeign:
      client:
        config:
          default:
            logger-level: full
            connect-timeout: 1000
            read-timeout: 2000

feign:
  sentinel:
    enabled: true

logging:
  level:
    com.zjc.consumer.feign: debug
    com.zjc.common.api: debug

management:
  tracing:
    export:
      zipkin:
        endpoint: http://129.204.226.206:9411/api/v2/spans

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
