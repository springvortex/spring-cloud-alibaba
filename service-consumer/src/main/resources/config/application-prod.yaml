server:
  port: 9002

spring:
  application:
    name: service-consumer
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 5000

feign:
  sentinel:
    enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false